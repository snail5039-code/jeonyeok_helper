[project]
name = "jeonyeok_helper"
version = "0.1.0"
description = "전역자 혜택 안내 에이전트 (RAG + LangGraph 슈퍼바이저)"
authors = [
    { name = "snail5039-code", email = "snail5039@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "mcp>=1.20,<2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jeonyeok-serve = "jeonyeok_helper.api.main:run"
jeonyeok-rag = "jeonyeok_helper.rag.ingest:main"
jeonyeok-mcp = "jeonyeok_helper.benefits.mcp_server:main"
jeonyeok-chat = "jeonyeok_helper.agents.chat:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

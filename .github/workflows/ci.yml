name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jeonyeok_helper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 키 없이도 서버가 뜨고 상태 확인이 통과하는지 본다.
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 jeonyeok_helper:ci
          for i in $(seq 1 30); do
            curl -fs localhost:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

# 실행:            docker compose up --build        → http://localhost:3000
# DB만 (로컬 개발): docker compose up -d db          → localhost:5432
# 법령 수집:        docker compose run --rm api jeonyeok-rag laws
# 보훈부 자료 수집:  backend/data/raw/에 파일을 넣고 docker compose run --rm api jeonyeok-rag files
# 평가:            docker compose run --rm api jeonyeok-eval
# 자료 갱신(바뀐 것만): docker compose run --rm api jeonyeok-rag refresh  (refresh 서비스가 7일마다 자동으로도 한다)
#
# API 키는 backend/.env 에 넣는다 (backend/.env.example 참고).

name: jeonyeok_helper

services:
  # 벡터 검색(pgvector)과 서비스 테이블(피드백)을 함께 둔다. AWS에서는 RDS PostgreSQL로 바꾼다.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jeonyeok
      POSTGRES_PASSWORD: jeonyeok # 로컬 개발용. 배포 때는 비밀값으로 바꾼다
      POSTGRES_DB: jeonyeok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeonyeok -d jeonyeok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    image: jeonyeok_helper-api:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://jeonyeok:jeonyeok@db:5432/jeonyeok
    volumes:
      - ./backend/data/raw:/app/data/raw:ro # 국가보훈부 자료 원본
      - state:/app/data/state # 대화 기록, 사용자 프로필
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 자료 자동 갱신: 7일마다 개정된 법령·조례만 다시 수집하고 검색 골든셋 점수를 DB(refresh_run)에 남긴다.
  # 서버(api)는 10분마다 BM25 색인 지문을 확인해 바뀐 색인으로 바꿔 끼운다.
  # 바로 한 번 돌리기: docker compose run --rm api jeonyeok-rag refresh
  refresh:
    image: jeonyeok_helper-api:latest
    command: ["jeonyeok-rag", "refresh", "--loop"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://jeonyeok:jeonyeok@db:5432/jeonyeok
    healthcheck:
      disable: true # 웹 서버가 아니다
    depends_on:
      api:
        condition: service_healthy # api가 DB 스키마를 최신으로 올린 뒤
    restart: unless-stopped

  web:
    build: ./frontend
    image: jeonyeok_helper-web:latest
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  state:
  pgdata:

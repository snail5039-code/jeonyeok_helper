# 실행:            docker compose up --build        → http://localhost:3000
# 법령 수집:        docker compose run --rm api jeonyeok-rag laws
# 보훈부 자료 수집:  backend/data/raw/에 파일을 넣고 docker compose run --rm api jeonyeok-rag files
# 평가:            docker compose run --rm api jeonyeok-eval
#
# API 키는 backend/.env 에 넣는다 (backend/.env.example 참고).

name: jeonyeok_helper

services:
  api:
    build: ./backend
    image: jeonyeok_helper-api:latest
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data/chroma:/app/data/chroma # 벡터 DB (수집한 법령·문서)
      - ./backend/data/raw:/app/data/raw:ro # 국가보훈부 자료 원본
      - state:/app/data/state # 대화 기록, 사용자 프로필
    restart: unless-stopped

  web:
    build: ./frontend
    image: jeonyeok_helper-web:latest
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  state:

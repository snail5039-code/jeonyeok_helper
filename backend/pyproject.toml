[project]
name = "jeonyeok_helper"
version = "0.1.0"
description = "전역자 혜택 안내 에이전트 (RAG + LangGraph 슈퍼바이저)"
authors = [
    { name = "snail5039-code", email = "snail5039@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20,<1.21",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.0",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.20,<2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.54,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jeonyeok-serve = "jeonyeok_helper.api.main:run"
jeonyeok-rag = "jeonyeok_helper.rag.ingest:main"
jeonyeok-mcp = "jeonyeok_helper.benefits.mcp_server:main"
jeonyeok-chat = "jeonyeok_helper.agents.chat:main"
jeonyeok-eval = "jeonyeok_helper.evaluation:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
eval = [
    "instructor[google-genai]==1.15.4",
    "langchain-community==0.4.1",
    "ragas==0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

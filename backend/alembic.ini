# Alembic CLI settings. The DB URL comes from .env (APP_DB_URL, default data/app.sqlite).
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "message"
# The server also runs "upgrade head" on startup.
# Keep this file ASCII only: on Windows, Alembic reads it with the system code page (cp949).

[alembic]
script_location = %(here)s/src/jeonyeok_helper/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

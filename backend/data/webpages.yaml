# 수집할 공식 안내 페이지. `uv run jeonyeok-rag web`
#
# name: 출처로 보일 이름 (기관명 + 내용)
# url: 로그인 없이 열리는 공개 페이지만
# selector: 본문 영역 CSS (없으면 #contents, main 등에서 글이 가장 많은 곳)
# start: 이 글이 처음 나오는 곳부터 저장 (앞쪽 메뉴·공유 버튼 제거)
#
# 국가보훈부 '지원안내'(key 141~146)는 하위 메뉴만 있는 목차 페이지라 넣지 않는다.

# 전역도우미 평가 질문 (40개)
#
# 정답 문장을 맞히는지가 아니라 '무엇을 근거로, 어떻게 행동했는지'를 본다.
# 금액·기한 같은 구체적 사실은 법령 개정으로 바뀔 수 있어 기준에 넣지 않는다.
#
# 항목
#   category     : conscript(병사) / short_term_officer(단기 간부) / long_term(중·장기) /
#                  merit(보훈대상자) / tools(외부 도구·자료) / general(일반)
#   sources_any  : 출처 제목 중 하나라도 이 단어를 포함해야 함
#   answer_any   : 답변에 이 단어 중 하나라도 있어야 함
#   answer_all   : 답변에 이 단어가 모두 있어야 함 (한 번에 여러 가지를 물었을 때)
#   tools_any    : 이 도구 중 하나라도 실제로 불러야 함 (실시간 API 연결 확인)
#   profile      : 대화에서 추출해야 하는 프로필 값
#   should_ask   : true면 답하지 말고 되물어야 함 / false면 되묻지 말아야 함


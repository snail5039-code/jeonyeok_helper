# 규정 검색 골든셋: 질문마다 상위 k개 안에 나와야 하는 근거.
#
# expect: 근거 묶음 목록. 묶음 하나는 '같은 근거로 인정할 표기' 목록이고, 검색 결과의 출처
#         (citation) 안에 그 표기가 들어 있으면 찾은 것으로 본다.
#         Recall = 찾은 묶음 / 전체 묶음, Hit = 하나라도 찾음, MRR = 첫 근거 순위의 역수
# region: 사용자 지역 (조례 검색)

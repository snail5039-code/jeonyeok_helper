# 정답은 법령·조문 제목과 내용으로 정했다 (검색 결과를 그대로 베끼지 않음).
# 안내서는 쪽 번호까지 적는다 (파일 이름만 적으면 아무 쪽이나 맞는 것으로 되어 너무 쉬워짐).


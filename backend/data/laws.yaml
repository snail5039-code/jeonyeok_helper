# 수집할 법령 목록. 이름은 국가법령정보센터의 정식 명칭과 정확히 같아야 한다.
# articles를 적으면 그 조문만 수집한다 (전역자와 관계없는 조문이 많은 큰 법령용).

laws:
  # 제대군인 지원의 핵심
  - name: 제대군인지원에 관한 법률
  - name: 제대군인지원에 관한 법률 시행령
  - name: 제대군인지원에 관한 법률 시행규칙

  # 보훈대상자
  - name: 국가유공자 등 예우 및 지원에 관한 법률
  - name: 국가유공자 등 예우 및 지원에 관한 법률 시행령
  - name: 보훈보상대상자 지원에 관한 법률
  - name: 국가보훈 기본법
  - name: 참전유공자 예우 및 단체설립에 관한 법률
  - name: 참전유공자 예우 및 단체설립에 관한 법률 시행령
  - name: 고엽제후유의증 등 환자지원 및 단체설립에 관한 법률

  # 병역, 군 복무
  - name: 병역법
  - name: 병역법 시행령
  - name: 군인사법
  - name: 군인복지기본법
  - name: 군인복지기본법 시행령
  - name: 군인연금법
  - name: 군인연금법 시행령
  - name: 예비군법
  - name: 예비군법 시행령

  # 복무 중 부상·질병 보상
  - name: 군인 재해보상법
  - name: 군인 재해보상법 시행령

  # 군복무 크레딧 (군 복무기간 가입기간 추가 산입)
  - name: 국민연금법
    articles: [제18조]
  - name: 국민연금법 시행령

  # 중소기업 취업 청년 소득세 감면 (병역 기간만큼 나이 기준 연장)
  - name: 조세특례제한법
    articles: [제30조]
  - name: 조세특례제한법 시행령
    articles: [제27조]

  # 군 복무 경력의 공무원 호봉 인정
  - name: 공무원보수규정
  - name: 지방공무원 보수규정
  # 전역예정자의 공무원 시험 응시
  - name: 공무원임용시험령
    articles: [제33조]

  # 전역 후 구직: 국민취업지원제도(구직촉진수당, 병역 기간만큼 나이 연장), 실업급여
  - name: 구직자 취업촉진 및 생활안정지원에 관한 법률
  - name: 구직자 취업촉진 및 생활안정지원에 관한 법률 시행령
  - name: 고용보험법
    articles: [제40조, 제41조, 제50조]
  - name: 고용보험법 시행령
    articles: [제70조]

  # 복무 중·전역 후 건강보험 (현역병 급여 정지·보험료 면제, 피부양자)
  - name: 국민건강보험법
    articles: [제5조, 제6조, 제54조, 제74조]

  # 군 복무 중 운전면허 갱신 연기
  - name: 도로교통법
    articles: [제87조]
  - name: 도로교통법 시행령
    articles: [제55조]

  # 장기복무 제대군인 국민주택 특별공급
  - name: 주택공급에 관한 규칙
    articles: [제35조]

# 행정규칙(훈령·고시·예규). 내부 운영 규정이 많아서 혜택과 관련된 것만 이름으로 고른다.
admin_rules:
  - name: 의무복무 제대군인 중 취(창)업 지원 필요 대상에 관한 고시
  - name: 제대군인 법률구조 지원 대상자 고시
  - name: 제대군인지원센터 운영지침
  - name: 군 전직 및 취업 지원 업무에 관한 훈령
  - name: 예비군 교육훈련 훈령
  - name: 예비군 휴업보상과 치료 등에 관한 훈령
  - name: 군인 공무상 질병 추정기준
  - name: 국가보훈대상자 의료지원 규정
  - name: 국가보훈대상자 노후복지서비스 규정
  - name: 국가보훈대상자 공공요금 감면 통합처리에 관한 지침

# 지자체 조례(자치법규)는 ordinances.yaml, 법령해석례는 interpretations.yaml에서 따로 관리한다.

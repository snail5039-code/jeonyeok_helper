# 수집할 지자체 조례 (uv run jeonyeok-rag ordinances)
# keywords로 국가법령정보센터 자치법규를 검색하고, 이름에 include 중 하나가 있고
# exclude가 하나도 없는 '조례'만 받는다. (시행규칙은 빼고 조례만)

keywords: [제대군인, 전역, 예비군, 군복무, 장병, 국가유공자, 보훈, 참전]

include:
  - 제대군인
  - 전역
  - 예비군
  - 군복무
  - 장병
  - 보훈대상자
  - 국가유공자 등 예우
  - 국가유공자 예우
  - 참전유공자
  - 보훈명예수당
  - 보훈수당

# 혜택이 아닌 시설 운영·주차구역 조례
exclude:
  - 우선주차
  - 회관
  - 훈련장 차량
  - 훈련장차량
  - 시설
